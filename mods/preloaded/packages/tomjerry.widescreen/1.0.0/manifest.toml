format_version = 5
id = "tomjerry.widescreen"
version = "1.0.0"
name = "Tom & Jerry Widescreen"
author = "TomJerryRecomp"
description = "Native-wide widescreen presentation for Tom and Jerry in House-Trap."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLES-03181"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Disabled by default. Renders a wider field of view instead of stretching the 4:3 picture. Menus and videos stay 4:3."
group = "Display"
default_enabled = false

[[feature]]
id = "italian-text-fix"
name = "Italian text fix"
description = "Shows \"SI\" correctly in the Italian menus. The original text uses an accented I that the game's font does not have, so it appeared as an orange block."
group = "Fixes"
default_enabled = true

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
description = "Fit follows the shape of the window, starting from 16:9. The other choices are fixed."
group = "Display"
type = "choice"
default = "fit"

[[option.choice]]
value = "fit"
label = "Fit to window"

[[option.choice]]
value = "16-9"
label = "16:9"

[[option.choice]]
value = "21-9"
label = "21:9"

[[option.choice]]
value = "32-9"
label = "32:9"

[[option]]
feature = "widescreen"
id = "hud_size"
label = "HUD size"
description = "Draws the in-game HUD smaller so its low-resolution art looks sharper. 100% is the original size."
group = "Display"
type = "choice"
default = "75"

[[option.choice]]
value = "100"
label = "100%"

[[option.choice]]
value = "85"
label = "85%"

[[option.choice]]
value = "75"
label = "75%"

[[option.choice]]
value = "65"
label = "65%"

[[option]]
feature = "widescreen"
id = "frame_rate"
label = "Frame rate"
description = "30 fps runs the console on NTSC video timing, the speed the game was designed for. 25 fps is the original PAL release. Music is unchanged either way."
group = "Display"
type = "choice"
default = "ntsc"

[[option.choice]]
value = "ntsc"
label = "30 fps (NTSC)"

[[option.choice]]
value = "25"
label = "25 fps (PAL)"

[[option]]
feature = "widescreen"
id = "high_refresh_vsync"
label = "VSync on high-refresh monitors"
description = "Keeps vertical sync on when the monitor runs above 60 Hz (120/144/165 Hz), so fast motion does not tear. Game speed is unchanged. OpenGL renderer."
group = "Display"
type = "choice"
default = "on"

[[option.choice]]
value = "on"
label = "On"

[[option.choice]]
value = "off"
label = "Off"

[[plugin]]
feature = "widescreen"
id = "tomjerry.widescreen"

# The floor is a tile grid (87 units per column) drawn by the overlay function
# at 0x80043634, which only submits columns within centre +-(7 + 2*rows/3) of
# the followed character. That window matches the 4:3 view, so wider views
# showed black strips that slid with the camera. Raising 7 to 64 lets the
# existing clamp to [0, cols] draw the whole room grid (at most 30x8 tiles).
# Overlay file sector LBA 170; offsets are lba*2048 + byte.
[[patch]]
feature = "widescreen"
target = "disc_user"
offset = 348660                 # 0x80043734 addiu v0,a1,-7
expected = "f9 ff a2 24"
replace = "c0 ff a2 24"         # addiu v0,a1,-64

[[patch]]
feature = "widescreen"
target = "disc_user"
offset = 348700                 # 0x8004375C addiu v0,a1,7
expected = "07 00 a2 24"
replace = "40 00 a2 24"         # addiu v0,a1,64

# NTSC timing: libgpu PutDispEnv starts the visible area at screen.y + 16 on
# NTSC (+19 on PAL). The game centres its PAL pictures with screen.y (24 in
# play, more on the LOADING screen), which on NTSC pushes them down and cuts
# off the bottom. Start every NTSC picture at line 16, the standard NTSC top;
# the PAL branch is untouched.
[[patch]]
feature = "widescreen"
target = "main_exe"
address = 0x80022A00
expected = "10 00 90 24"        # addiu s0,a0,16
replace = "10 00 10 24"         # addiu s0,zero,16
when = { frame_rate = "ntsc" }

# "SÌ" is stored as Latin-1 0xCC, which the game's font has no glyph for (it
# samples an orange gradient instead). Plain "I" (0x49) renders correctly.
[[patch]]
feature = "italian-text-fix"
target = "disc_user"
offset = 70413                  # LBA 34: options menu "SÌ"
expected = "cc"
replace = "49"

[[patch]]
feature = "italian-text-fix"
target = "disc_user"
offset = 320421                 # LBA 156: pause menu "SÌ"
expected = "cc"
replace = "49"
