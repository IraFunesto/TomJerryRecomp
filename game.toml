# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "TomJerry"
id = "SLES-03181"
players = 2
exe = "disc/SLES_031.81"
disc = "disc/Tom and Jerry in House Trap (E) (En,Fr,De,Es,It,Nl,Da).cue"
load_address = "0x80010000"
entry_pc = "0x8001380C"
text_size = "0x0002C000"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Tom and Jerry in House Trap (E) (En,Fr,De,Es,It,Nl,Da).bin"
cue_name = "Tom and Jerry in House Trap (E) (En,Fr,De,Es,It,Nl,Da).cue"
boot_exe = "SLES_031.81"
known_sizes = [126596400]
known_md5 = [
  "3702c68b252255fcd30c4fffc85706c7",
]
known_sha1 = [
  "494183e2a4743dc2fd9835839dc5f76a91d7f2a7",
]
known_crc32 = [
  "b3f735f1",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Widescreen HUD hook (plugins/mod_tomjerry_widescreen.c): DrawHudSprite in the
# gameplay overlay. Listing it makes natively compiled overlay shards call the
# function-entry hook too, not just the interpreter.
mod_function_entry_funcs = ["0x8004883C"]

[runtime]
window_title = "TomJerry Recompiled"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 2
# Runtime TOC fingerprint (disc_identity.cpp). The cue's track 2 has a
# "PREGAP 00:02:00" the dump does not store: the runtime inserts it as 150
# virtual sectors (track 2 start 40165, leadout 53975), which probe_disc.py's
# compute_disc_fp ignores -- its value (cd42d4dd...) never matches.
required_disc_fp = "5c3c0cff34cb23a5df57a4fc4021c59572dc3f55186e2cc90c3a22fbe71c32f6"

[widescreen]
gte_game_mode = true
# Native-wide only while the gameplay overlay is resident: DrawHudSprite's
# first instruction (0x8004883C = addiu sp,sp,-56) exists only there. The
# level-select book animates its page turns in 3D, which fooled the GTE
# classifier into wide frames whose 4:3-only background left trails at the
# sides; pause and every in-match frame keep the overlay, so stay wide.
gameplay_state_addr = "0x8004883C"
gameplay_state_values = ["0x27BDFFC8"]

[widescreen.cull]
branch_keep_sites = ["0x80077780", "0x800777A4", "0x800778C4", "0x800778E0", "0x80077A60", "0x80077A84", "0x80077BDC", "0x80077BF8", "0x80077D74", "0x80077D98", "0x80077F78", "0x80077F9C", "0x800780A0", "0x800780BC", "0x80078208", "0x8007822C", "0x80078358", "0x80078374", "0x800784B0", "0x800784D4", "0x80062C48", "0x80062C98"]